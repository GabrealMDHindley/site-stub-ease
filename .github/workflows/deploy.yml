# Deploys every push on main to the client's existing Vercel project
# (production). Secrets live in this repo's Actions secrets:
#   VERCEL_TOKEN       - token created in the client's Vercel account
#   VERCEL_ORG_ID      - the client's Vercel Team ID (team_...)
#   VERCEL_PROJECT_ID  - the stubease.com project's ID (prj_...)
name: Deploy to Vercel
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: vercel-production
  cancel-in-progress: false
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
jobs:
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --global vercel@latest
      - name: Check Vercel credentials
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # Trim stray whitespace/newlines that can sneak in when pasting secrets.
          ORG="$(printf %s "$VERCEL_ORG_ID" | tr -d '[:space:]')"
          PRJ="$(printf %s "$VERCEL_PROJECT_ID" | tr -d '[:space:]')"
          TOK="$(printf %s "$VERCEL_TOKEN" | tr -d '[:space:]')"
          fail=0
          [ -n "$TOK" ] || { echo "::error::VERCEL_TOKEN secret is empty"; fail=1; }
          [ -n "$ORG" ] || { echo "::error::VERCEL_ORG_ID secret is empty"; fail=1; }
          [ -n "$PRJ" ] || { echo "::error::VERCEL_PROJECT_ID secret is empty"; fail=1; }
          [ "$fail" = 0 ] || exit 1
          echo "VERCEL_ORG_ID     starts with '${ORG:0:5}' (expected 'team_'), length ${#ORG}"
          echo "VERCEL_PROJECT_ID starts with '${PRJ:0:4}' (expected 'prj_'), length ${#PRJ}"
          case "$TOK" in vcp_*) echo "token type: scoped token (vcp_)";; *) echo "token type: classic account token";; esac
          H="Authorization: Bearer $TOK"
          proj=$(curl -s -o project.json -w '%{http_code}' -H "$H" "https://api.vercel.com/v9/projects/$PRJ")
          team=$(curl -s -o /dev/null -w '%{http_code}' -H "$H" "https://api.vercel.com/v2/teams/$ORG")
          teams=$(curl -s -o teams.json -w '%{http_code}' -H "$H" "https://api.vercel.com/v2/teams?limit=100")
          echo "project readable with token   GET /v9/projects/<PROJECT_ID> -> HTTP $proj (200 = ok)"
          echo "team readable with token      GET /v2/teams/<ORG_ID>        -> HTTP $team (200 = ok)"
          echo "teams list with token         GET /v2/teams                 -> HTTP $teams"
          if [ "$proj" != 200 ]; then
            echo "::error::The token cannot read project VERCEL_PROJECT_ID (HTTP $proj). Either the Project ID is wrong (stubease.com project > Settings > General > Project ID, starts with prj_) or the token is invalid/expired."; exit 1
          fi
          owner=$(jq -r '.accountId // empty' project.json)
          pname=$(jq -r '.name // empty' project.json)
          echo "project name: $pname"
          if [ "$owner" = "$ORG" ]; then echo "project.accountId == VERCEL_ORG_ID: yes"; else echo "project.accountId == VERCEL_ORG_ID: NO (starts with '${owner:0:5}', length ${#owner})"; fi
          if [ "$teams" = 200 ]; then
            if jq -e --arg id "$ORG" '.teams[]? | select(.id == $id)' teams.json >/dev/null; then echo "VERCEL_ORG_ID appears in the token's team list: yes"; else echo "VERCEL_ORG_ID appears in the token's team list: no"; fi
          fi
          rm -f project.json teams.json
          if [ "$owner" != "$ORG" ]; then
            echo "::error::VERCEL_ORG_ID is not the team that owns this project. Replace it with the Team ID of the team that owns the stubease.com project (switch to that team top-left > Settings > General > Team ID)."; exit 1
          fi
          if [ "$team" != 200 ]; then
            echo "::error::The token can read the project but not its team (HTTP $team), so the Vercel CLI cannot link. The token was scoped to the project only. Create a new token with Scope = the whole team (no project restriction) and replace VERCEL_TOKEN."; exit 1
          fi
          echo "All three credentials check out."
          echo "VERCEL_ORG_ID=$ORG" >> "$GITHUB_ENV"
          echo "VERCEL_PROJECT_ID=$PRJ" >> "$GITHUB_ENV"
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
